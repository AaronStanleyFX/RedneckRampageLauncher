// Redneck Rampage Trainer - key bindings (H J K L N U O P), executed by the launcher at game start
set rrtr_s_health 0
alias rrtr_health_on "spawn 29101; set rrtr_s_health 1; alias rrtr_health_tog rrtr_health_off"
alias rrtr_health_off "spawn 29111; set rrtr_s_health 0; alias rrtr_health_tog rrtr_health_on"
alias rrtr_health_tog rrtr_health_on
set rrtr_s_ammo 0
alias rrtr_ammo_on "spawn 29102; set rrtr_s_ammo 1; alias rrtr_ammo_tog rrtr_ammo_off"
alias rrtr_ammo_off "spawn 29112; set rrtr_s_ammo 0; alias rrtr_ammo_tog rrtr_ammo_on"
alias rrtr_ammo_tog rrtr_ammo_on
set rrtr_s_inv 0
alias rrtr_inv_on "spawn 29103; set rrtr_s_inv 1; alias rrtr_inv_tog rrtr_inv_off"
alias rrtr_inv_off "spawn 29113; set rrtr_s_inv 0; alias rrtr_inv_tog rrtr_inv_on"
alias rrtr_inv_tog rrtr_inv_on
set rrtr_s_fly 0
alias rrtr_fly_on "spawn 29104; set rrtr_s_fly 1; alias rrtr_fly_tog rrtr_fly_off"
alias rrtr_fly_off "spawn 29114; set rrtr_s_fly 0; alias rrtr_fly_tog rrtr_fly_on"
alias rrtr_fly_tog rrtr_fly_on
set rrtr_s_clip 0
alias rrtr_clip_on "noclip; echo TRAINER : NO CLIP [ON]; set rrtr_s_clip 1; alias rrtr_clip_tog rrtr_clip_off"
alias rrtr_clip_off "noclip; echo TRAINER : NO CLIP [OFF]; set rrtr_s_clip 0; alias rrtr_clip_tog rrtr_clip_on"
alias rrtr_clip_tog rrtr_clip_on
set rrtr_s_mon 0
alias rrtr_mon_on "activatecheat rdcritters; echo TRAINER : REMOVE ENEMIES [ON]; set rrtr_s_mon 1; alias rrtr_mon_tog rrtr_mon_off"
alias rrtr_mon_off "activatecheat rdcritters; activatecheat rdcritters; echo TRAINER : REMOVE ENEMIES [OFF]; set rrtr_s_mon 0; alias rrtr_mon_tog rrtr_mon_on"
alias rrtr_mon_tog rrtr_mon_on
alias rrtr_build "spawn 29105"
alias rrtr_status "spawn 29106"
bind h rrtr_health_tog
bind j rrtr_ammo_tog
bind k rrtr_inv_tog
bind l rrtr_fly_tog
bind n rrtr_clip_tog
bind u rrtr_mon_tog
bind o rrtr_build
bind p rrtr_status
echo TRAINER : CHARGE
